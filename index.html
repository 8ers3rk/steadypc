<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- connect-src only allows the local Vite dev server; the packaged app makes no network requests. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-2tNvzq+2GN/dUv7OmRltQcSZf/sqjE+wrB85q2DF7Fc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; worker-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>SteadyPC — диагностика Windows</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('steadypc.theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
